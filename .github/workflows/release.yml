name: Release

# Runs when a version tag is pushed, e.g.:  git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release and upload assets
  actions: read   # lets SignPath read the build artifact it is asked to sign

jobs:
  release:
    runs-on: windows-latest
    env:
      # Optional. When set, the exe is signed by SignPath (see README, "Code signing").
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set app version from the tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Download Neutralino binary and client library
        run: npm run setup

      - name: Build the exe
        run: npm run build

      # ---- Code signing with SignPath (skipped when SIGNPATH_API_TOKEN is not set) ----
      - name: Upload unsigned exe for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/NSSMServicesManager-*.exe

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nssm-services-manager
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed exe and verify the signature
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          # SignPath returns the signed artifact; unpack it if it came back as a zip.
          Get-ChildItem signed -Filter *.zip -ErrorAction SilentlyContinue | ForEach-Object {
            Expand-Archive $_.FullName -DestinationPath signed -Force
          }
          $signed = Get-ChildItem signed -Recurse -Filter NSSMServicesManager-*.exe
          if (-not $signed) { throw 'No signed exe was returned by SignPath.' }
          foreach ($exe in $signed) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ($sig.Status -ne 'Valid') { throw "Bad signature on $($exe.Name): $($sig.Status)" }
            Write-Host "$($exe.Name): signed by $($sig.SignerCertificate.Subject)"
            Copy-Item $exe.FullName (Join-Path dist $exe.Name) -Force
          }

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NSSMServicesManager-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          # Tags like v1.2.0-beta.1 are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
